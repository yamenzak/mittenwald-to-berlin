# Publishes the built page to GitHub Pages.
#
# Only index.html is uploaded — the rest of the repo is the build, not the
# thing being served, and the page is 4 MB on its own.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Turn Pages on if it is not already
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Collect the page
        run: |
          mkdir -p _site
          cp index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
